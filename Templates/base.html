<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StockFlow{% endblock %} · StockFlow Engine</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <a class="visually-hidden-focusable skip-link" href="#main">Skip to main content</a>

  <nav class="navbar navbar-expand-lg sf-navbar" aria-label="Main navigation">
    <div class="container-xl">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('dashboard') }}">
        <i class="bi bi-box-seam-fill" aria-hidden="true"></i> StockFlow
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          {% for key, label, icon in nav_items %}
          <li class="nav-item">
            <a class="nav-link{% if active_page == key %} active{% endif %}" {% if active_page==key
              %}aria-current="page" {% endif %} href="{{ url_for(key) }}">
              <i class="bi bi-{{ icon }} me-1" aria-hidden="true"></i>{{ label }}
            </a>
          </li>
          {% endfor %}
        </ul>
        <span class="navbar-text d-flex align-items-center gap-2">
          <i class="bi bi-person-circle" aria-hidden="true"></i> Reception
          <span class="vr d-none d-lg-block"></span>
          <time datetime="{{ today.isoformat() }}">
            {{ today.strftime('%d %b %Y').lstrip('0') }}
          </time>
        </span>
      </div>
    </div>
  </nav>

  <main id="main" class="container-xl py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="container-xl py-3 sf-footer">
    <small>StockFlow Engine · Penbro Kelnick (Pty) Ltd</small>
  </footer>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="true">
    <div id="sfToast" class="toast align-items-center text-bg-dark border-0" role="status">
      <div class="d-flex">
        <div class="toast-body" id="sfToastBody"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
          aria-label="Close notification"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>window.SF = {{ payload | tojson }};</script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
